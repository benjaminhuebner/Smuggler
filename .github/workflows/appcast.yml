name: Appcast

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appcast

jobs:
  publish:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      # Release events run this file from the tag's commit; the feed always comes from the newest scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch Sparkle's tools
        run: |
          xcodebuild -resolvePackageDependencies -project Smuggler.xcodeproj -scheme Smuggler \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -quiet
          echo "SPARKLE_BIN=$RUNNER_TEMP/packages/artifacts/sparkle/Sparkle/bin" >>"$GITHUB_ENV"

      - name: Publish the appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: .github/scripts/publish-appcast.sh
